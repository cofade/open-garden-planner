name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest
    # A release run takes 9-13 minutes (measured over the v1.29.x releases). Without
    # a limit a hung step holds the job for GitHub's default of six hours.
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Skip chore/sync commits — they follow a real release and race-condition
    # the tag lookup, causing the workflow to compute a stale version number.
    # Matches both a bare `chore:` and a scoped `chore(...)` prefix (a scoped
    # message like `chore(finalize-us):` previously slipped through and wrongly
    # triggered a release).
    if: "!startsWith(github.event.head_commit.message, 'chore:') && !startsWith(github.event.head_commit.message, 'chore(')"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # Full history for git tags

      - name: Determine version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/resolve_release_pr.py --write-github-output

      - name: Check if tag already exists
        id: check_tag
        shell: bash
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if tag exists
        if: steps.check_tag.outputs.exists == 'true'
        run: echo "Tag ${{ steps.version.outputs.tag }} already exists, skipping release."

      - name: Set up Python 3.11
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.9"

      - name: Install locked environment
        if: steps.check_tag.outputs.exists == 'false'
        uses: ./.github/actions/setup-locked-env

      - name: Verify dependency lock
        if: steps.check_tag.outputs.exists == 'false'
        run: python scripts/check_dependency_lock.py

      - name: Install NSIS
        if: steps.check_tag.outputs.exists == 'false'
        run: choco install nsis --version=3.13.0 -y

      # Reproducible build evidence (AUD-049): record the exact toolchain the
      # artifact was produced with. The step writes dist/build-evidence.json and
      # fails the release if a required tool version cannot be established.
      - name: Emit build evidence
        if: steps.check_tag.outputs.exists == 'false'
        run: >
          python scripts/emit_build_evidence.py
          --output dist/build-evidence.json
          --commit "${{ github.sha }}"
          --run-id "${{ github.run_id }}"
          --require-complete

      - name: Upload build evidence
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-evidence-${{ github.run_id }}
          path: dist/build-evidence.json

      - name: Build installer
        if: steps.check_tag.outputs.exists == 'false'
        run: python installer/build_installer.py --version ${{ steps.version.outputs.version }}

      # Exercise the lazily-imported subsystems in the ACTUAL frozen build
      # before release. The startup-only smoke test can't see them: a Qt
      # micro-version mismatch in the 3D view of the time (issue #277, Qt 3D -
      # removed in Phase 17 L1.10) shipped that way and crashed the 3D view for
      # every user. `--selftest` starts the embedded Agent API server, runs the
      # A1 checks and renders the 3D engine's frame, exiting non-zero if any of
      # them is dead. Start-Process gives the child NO INHERITED STDOUT HANDLE, which is
      # the shipping condition (#291): a `console=False` exe has no console
      # allocated, but a shell-piped run still inherits a handle and would test
      # the wrong thing. The exit code is the channel either way -- hence
      # -Wait -PassThru rather than a plain call, which PowerShell would not
      # wait on at all for a GUI-subsystem process.
      #
      # Since Phase 17 L1.2 (ADR-048) `--selftest` RENDERS: it loads the
      # Qt Quick 3D scene (Garden.qml + its shaders) from the bundle, draws one
      # 160x120 frame without showing a window and checks its pixels. This
      # runner has no GPU -- the frame is rendered by Direct3D 11 on WARP.
      #
      # It cannot hang the job. Inside the exe ONE watchdog bounds the whole
      # self-test -- every block, not only the render: after 300 s it writes the
      # reason and every thread's stack into the log and exits with code 1. A
      # process deadlocked inside Qt was measured to survive that exit, so a
      # second process (the same exe, `--selftest-supervisor`) terminates it from
      # outside ten seconds later. Around it this step has its own limit, and the
      # job has one too.
      #
      # The exit code ALONE decides. The log (the exe has no stdout;
      # OGP_SELFTEST_LOG puts it where the next step can read it) is printed by
      # a step of its own that ALWAYS runs -- also when this one was cut off by
      # its time limit, which prints nothing after the cut -- and that can fail
      # nothing: a log that cannot be read must not turn a passing build red,
      # nor hide a failing one behind a different error. No Write-Error here:
      # under GitHub's pwsh it ends the step at once.
      #
      # Both scripts are the SAME text in frozen-selftest.yml, which runs them on
      # pull requests (pinned by tests/unit/test_quick3d_packaging.py).
      - name: Verify frozen subsystems (Agent API #291, A1 checks, Qt Quick 3D render #277)
        if: steps.check_tag.outputs.exists == 'false'
        shell: pwsh
        timeout-minutes: 10
        env:
          OGP_SELFTEST_LOG: ${{ runner.temp }}/ogp-selftest-3d.log
        run: |
          $exe = "dist/OpenGardenPlanner/OpenGardenPlanner.exe"
          if (-not (Test-Path $exe)) { Write-Host "::error::Frozen exe not found: $exe"; exit 1 }
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Write-Host "::error::Frozen self-test failed (exit $($p.ExitCode)). It covers the embedded Agent API server binding (#291), the A1 ingestion checks AND the Qt Quick 3D engine (Garden.qml and its shaders loaded from the bundle and rendered into one frame on this GPU-less runner, Direct3D 11 on WARP) - one of those is dead in this build, a lazily loaded part only the real artifact shows (the #277 class). The next step prints the self-test log: it names the failed 3D check, or shows the watchdog's reason and stack dump if any part hung."
            exit 1
          }
          Write-Host "Frozen self-test passed (exit 0): Agent API, A1 checks and the Qt Quick 3D render are all alive."

      - name: Print the self-test log
        if: always() && steps.check_tag.outputs.exists == 'false'
        shell: pwsh
        env:
          OGP_SELFTEST_LOG: ${{ runner.temp }}/ogp-selftest-3d.log
        run: |
          try {
            if (Test-Path -LiteralPath $env:OGP_SELFTEST_LOG) {
              Write-Host "--- self-test log ($env:OGP_SELFTEST_LOG) ---"
              Get-Content -LiteralPath $env:OGP_SELFTEST_LOG -ErrorAction Stop | ForEach-Object { Write-Host $_ }
            } else {
              Write-Host "No self-test log was written: the self-test did not run, or the exe did not get as far as opening it."
            }
          } catch {
            Write-Host "The self-test log could not be printed ($($_.Exception.Message)). The verdict of the self-test step stands."
          }
          exit 0

      - name: Generate checksum
        if: steps.check_tag.outputs.exists == 'false'
        shell: bash
        run: |
          cd dist
          sha256sum "OpenGardenPlanner-v${{ steps.version.outputs.version }}-Setup.exe" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes preamble
        if: steps.check_tag.outputs.exists == 'false'
        shell: bash
        run: |
          cat > dist/RELEASE_NOTES.md <<EOF
          ### Verify this release

          \`\`\`powershell
          (Get-FileHash .\OpenGardenPlanner-v${{ steps.version.outputs.version }}-Setup.exe -Algorithm SHA256).Hash
          # compare with SHA256SUMS.txt, attached to this release
          \`\`\`

          \`\`\`bash
          gh attestation verify OpenGardenPlanner-v${{ steps.version.outputs.version }}-Setup.exe -R cofade/open-garden-planner --signer-workflow cofade/open-garden-planner/.github/workflows/release.yml
          # or, for the installed app exe itself (the file Defender may flag):
          gh attestation verify OpenGardenPlanner.exe -R cofade/open-garden-planner --signer-workflow cofade/open-garden-planner/.github/workflows/release.yml
          \`\`\`

          If the attestation command above reports no attestations found, the
          provenance step for this specific release may still be running or
          may have failed independently of the release itself (it runs after
          this release is published) — the SHA-256 checksum above still
          verifies download integrity either way. See README "Verify your
          download" for what each check proves and why Windows
          SmartScreen/Defender may still warn on an unsigned installer.

          ### Software bill of materials (SBOM)

          \`ogp-sbom.cdx.json\` (CycloneDX 1.5) lists every third-party Python
          distribution bundled into this build and its license; the same
          inventory is attached as \`THIRD_PARTY_NOTICES.md\` and installed
          next to the application's GPLv3 LICENSE. Both files are generated
          from the frozen bundle's own metadata by
          \`scripts/generate_distribution_inventory.py\`.
          EOF

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ steps.version.outputs.tag }}
          "dist/OpenGardenPlanner-v${{ steps.version.outputs.version }}-Setup.exe"
          "dist/SHA256SUMS.txt"
          "dist/ogp-sbom.cdx.json"
          "dist/THIRD_PARTY_NOTICES.md"
          "dist/build-evidence.json"
          --title "${{ steps.version.outputs.tag }}"
          --notes-file "dist/RELEASE_NOTES.md"
          --generate-notes

      # Cryptographically binds each artifact's digest to this exact commit
      # SHA and public workflow run (Sigstore-backed, no paid cert needed) so
      # anyone can verify a release was built by public CI from the public
      # source, not just assume it (issue #356: Defender false-positive
      # report). Covers the installer AND the raw app exe it packages —
      # `dist/OpenGardenPlanner/OpenGardenPlanner.exe` is the exact file
      # Defender quarantined in #356, so it needs its own attestation, not
      # just the installer's. Verify with `gh attestation verify <file> -R
      # cofade/open-garden-planner`. This proves build provenance; it does
      # NOT make anything Authenticode-signed, so SmartScreen/Defender
      # warnings can still appear (§11.1/§11.2, ADR-044). Runs after the
      # release is already published so a Sigstore/attestations-API hiccup
      # never costs a release — see docs/11-risks-and-technical-debt §11.2.
      - name: Attest build provenance
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/OpenGardenPlanner-v${{ steps.version.outputs.version }}-Setup.exe
            dist/SHA256SUMS.txt
            dist/OpenGardenPlanner/OpenGardenPlanner.exe
            dist/ogp-sbom.cdx.json
            dist/THIRD_PARTY_NOTICES.md

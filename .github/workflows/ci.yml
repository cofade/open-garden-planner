name: CI

permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  agent-context:
    name: Agent context parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Claude/Codex context parity
        run: python scripts/check_agent_context.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: ./.github/actions/setup-locked-env

      - name: Run ruff
        run: ruff check src/ tests/ scripts/

      - name: Validate repository wiki sources (offline)
        run: python scripts/sync_wiki.py --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - uses: ./.github/actions/setup-locked-env

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -v

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: ./.github/actions/setup-locked-env

      - name: Run Bandit (fail on HIGH severity)
        run: bandit -r src/ --severity-level high

      # Credential scan over EVERY tracked file, not just src/.
      #
      # Added after a live Agent API write token was committed to the repo root
      # in a throwaway verification script and pushed (PR #369, 2026-09-29).
      # Bandit never saw it: it runs `-r src/`, and the file was at the repo
      # root — outside that scope — and Bandit has no rule for a credential in
      # a URL query string, which is exactly how OGP's token travels.
      #
      # gitleaks was tried first and rejected on measurement, not taste: its
      # `generic-api-key` rule matches identifier NAMES, and this repo's
      # vocabulary is full of them (`species_key`, `exclude_antagonists_of`, a
      # "Shift+Arrow Keys" row in the translation table) — 29 findings, zero
      # real secrets. Suppressing that rule is not viable either, because it is
      # the rule that catches an OGP token. An `[[allowlists]]` scoped by rule
      # + path was silently ignored under `[extend] useDefault`: identical
      # finding count with and without it. A gate nobody can keep green is a
      # gate that ends up catching nothing, so this targets the specific
      # credential formats instead — see scripts/check_no_secrets.py for the
      # rejected alternatives and the reasoning.
      - name: Check for committed secrets
        run: python scripts/check_no_secrets.py

  dependencies:
    name: Dependencies (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-locked-env
      - name: Verify lock and export
        run: python scripts/check_dependency_lock.py

  types:
    name: Types (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-locked-env
      - name: Enforce per-file type allowances
        run: python scripts/check_mypy_baseline.py --report type-report.json
      - name: Upload type diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: types-${{ matrix.os }}
          path: type-report.json

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0
      - uses: ./.github/actions/setup-locked-env
      - name: Measure full-suite line and branch coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -v --cov=open_garden_planner --cov-branch --cov-report=xml --cov-report=term
      - name: Enforce package line floors
        if: always()
        run: python scripts/check_coverage_floors.py --xml coverage.xml --report coverage-summary.json
      - name: Upload coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux
          path: |
            coverage.xml
            coverage-summary.json

  # The 3D render tier (Phase 17 L1.2, ADR-048): the engine package
  # ui/view3d/quick3d/ on a real renderer.
  #
  # The `Test` job runs QT_QPA_PLATFORM=offscreen, where Qt Quick falls back to
  # the software scene graph, which draws no 3D at all -- so every render test
  # skips there (OGP_RENDER3D unset). Here they run: each test module starts a
  # driver process with a REAL Qt platform and judges the frames it saves with
  # its own CPU projection (tests/integration/quick3d_render_support.py).
  #   Linux:   xvfb + the xcb platform + OpenGL on Mesa llvmpipe. The test
  #            helper selects xcb for the driver; the pytest process itself
  #            stays offscreen, as in every other job.
  #   Windows: the runner has no GPU -- Direct3D 11 renders on WARP, which is
  #            exactly the condition release.yml's `--selftest` runs under.
  # Kept lean for software rasterisers: 480x360 probe frames, no sky light
  # probe, one driver process per module, per-test timeouts.
  #
  # NOT a required check (quality/master-protection.json): a software
  # rasteriser on a shared runner proves correctness, not speed, and the
  # hardware-only budgets in these tests skip themselves on one.
  render3d:
    name: Render 3D (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      OGP_RENDER3D: "1"
      OGP_RENDER3D_ARTIFACTS: ${{ github.workspace }}/render3d-artifacts
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt, X11 and Mesa libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libgl1-mesa-dri libglx-mesa0 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1
      - uses: ./.github/actions/setup-locked-env
      - name: Render tier (Linux -- xvfb, xcb, OpenGL on llvmpipe)
        if: runner.os == 'Linux'
        env:
          QSG_RHI_BACKEND: opengl
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest tests/integration/test_quick3d_render.py tests/integration/test_quick3d_engine.py tests/integration/test_quick3d_selftest.py tests/integration/test_quick3d_lifecycle.py -v
      - name: Render tier (Windows -- Direct3D 11 on WARP)
        if: runner.os == 'Windows'
        run: python -m pytest tests/integration/test_quick3d_render.py tests/integration/test_quick3d_engine.py tests/integration/test_quick3d_selftest.py tests/integration/test_quick3d_lifecycle.py -v
      - name: Upload frames, results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render3d-${{ matrix.os }}
          path: render3d-artifacts/
          if-no-files-found: ignore

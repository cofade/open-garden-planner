name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  agent-context:
    name: Agent context parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Claude/Codex context parity
        run: python scripts/check_agent_context.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check src/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -v

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install "bandit>=1.7.0"

      - name: Run Bandit (fail on HIGH severity)
        run: bandit -r src/ --severity-level high

      # Full-repo secret scan, NOT just src/.
      #
      # Added after a live Agent API write token was committed to the repo
      # root in a throwaway verification script and pushed (PR #369, 2026-09-29).
      # Bandit never saw it: it runs `-r src/`, and a root-level file is outside
      # that scope. Bandit also has no rule for a credential in a URL query
      # string, so even in scope it would not have flagged the pattern. The
      # token had to be rotated by hand.
      #
      # gitleaks scans the whole tree AND the full history of the checked-out
      # ref, so it covers both the miss above and its replacement class. This
      # repo's own precedent applies: gate commands get regression pins
      # (test_gate_commands.py), because a release-critical step with no pin
      # silently degrades for releases at a time.
      - name: Set up Go for gitleaks
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Run gitleaks (full history, fail on any finding)
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required by the action; used only to fetch tags for --log-opts.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # --all scans the WHOLE history, not just the commits this push
          # touched. Without it the scan passes on the very commit that
          # deletes a leaked secret — which is the commit that makes this
          # gate necessary in the first place. --redact keeps a re-run from
          # reprinting the credential into the job log. No --exit-code 0:
          # a scan that finds a secret and exits 0 is a log line, not a gate.
          args: detect --redact --no-banner --log-opts="--all"

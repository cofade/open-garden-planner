# TEMPORARY — ADR-047 / Phase 17 Package L0 evidence. DELETE BEFORE MERGE
# (together with scripts/spike_q3d_ci.py).
#
# Renders the dormant Qt Quick 3D spike on windows-latest — a GPU-less runner,
# so Qt picks Direct3D 11 on the Microsoft Basic Render Driver (WARP class);
# fps here are NOT owner-GPU numbers. Run v1 proved build + --selftest with
# Quick 3D bundled, then hung 56 min in the render with no output, so v2:
#   * runs the spike through scripts/spike_q3d_ci.py — hard timeout, and every
#     result (manifest, spike.log, metrics.json) is printed into this job log;
#   * renders unfrozen first, then frozen: splits "WARP/rendering" from
#     "packaging" when something fails;
#   * measures the honest dist delta against a master build (ADR-047 crit. 9).
# This is an evidence run, not a release gate: the frozen-exe gate command has
# one home (ogp-change-control §2.8, executed by release.yml) and is not
# repeated here.
name: Spike Q3D (temporary)

on:
  push:
    branches: [claude/upbeat-keller-jig1p6]
    paths:
      - "src/open_garden_planner/spike_q3d/**"
      - "src/open_garden_planner/main.py"
      - "installer/ogp.spec"
      - "scripts/spike_q3d_ci.py"
      - ".github/workflows/spike-q3d.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-q3d-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-evidence:
    name: Qt Quick 3D spike evidence (windows-latest, WARP)
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyinstaller

      # v2 measured (default threaded render loop, D3D11 on WARP): frames ~1 s,
      # but one grabWindow() of the sky-lit scene ~100 s. A/B: the basic loop.
      - name: Spike, unfrozen, basic render loop (grab-cost A/B)
        id: unfrozen
        continue-on-error: true
        timeout-minutes: 14
        shell: bash
        env:
          QSG_RENDER_LOOP: basic
        run: >
          python scripts/spike_q3d_ci.py --unfrozen --out spike-unfrozen --limit-s 720 --
          --cold --presets low --shots golden_hour --fps-seconds 1 --iou
          --size 960x540 --grass-density 60 --frame-timeout-s 120 --watchdog-s 660

      - name: Build frozen exe
        run: python -m PyInstaller installer/ogp.spec --noconfirm

      # Normal start of the bundle that carries the spike must survive 8 s
      # (ADR-038's spike evidence ran this next to --selftest).
      - name: Frozen bundle, normal-start smoke
        id: smoke
        continue-on-error: true
        timeout-minutes: 3
        shell: bash
        run: python scripts/spike_q3d_ci.py --frozen-smoke --out spike-smoke

      - name: Measure branch dist footprint
        shell: pwsh
        run: |
          $dist = "dist/OpenGardenPlanner"
          $files = Get-ChildItem $dist -Recurse -File
          $total = ($files | Measure-Object Length -Sum).Sum / 1MB
          $q3d = ($files | Where-Object { $_.FullName -match 'Quick3D|ShaderTools' } | Measure-Object Length -Sum).Sum / 1MB
          $qt3d = ($files | Where-Object { $_.Name -match '^Qt63D' } | Measure-Object Length -Sum).Sum / 1MB
          "branch_dist_total_mb=$([math]::Round($total,1))" | Tee-Object -FilePath footprint.txt
          "quick3d_and_shadertools_mb=$([math]::Round($q3d,1))" | Tee-Object -FilePath footprint.txt -Append
          "qt3d_dlls_mb=$([math]::Round($qt3d,1))" | Tee-Object -FilePath footprint.txt -Append

      - name: Spike, frozen bundle (full evidence set)
        id: frozen
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        run: >
          python scripts/spike_q3d_ci.py --frozen --out spike-frozen --limit-s 1620
          --expect-caches none --
          --plan tests/fixtures/plans/bench_small.ogp
          --presets low,high --shots golden_hour --fps-seconds 2 --iou --orient
          --pick --update-bench --second-window --coexist --pan-bench --soak 100
          --size 960x540 --grass-density 60 --frame-timeout-s 120 --watchdog-s 1560

      # Criterion 5, warm: the same shot again, now that the first launch of this
      # bundle has written its shader and pipeline caches (metrics.json records
      # which caches each launch found).
      - name: Spike, frozen bundle, warm relaunch
        id: warm
        continue-on-error: true
        timeout-minutes: 12
        shell: bash
        run: >
          python scripts/spike_q3d_ci.py --frozen --out spike-frozen-warm --limit-s 660
          --expect-caches found --
          --plan tests/fixtures/plans/bench_small.ogp
          --presets low --shots golden_hour --fps-seconds 0
          --size 960x540 --grass-density 60 --frame-timeout-s 120 --watchdog-s 600

      # The leak gate's positive control, on the same runner it judges: the same
      # 20-reload soak with 25 MB kept alive per reload. The step passes only if
      # the leak gate fires and nothing else fails (fixed before run v9 read it).
      - name: Spike, frozen bundle, leak-gate positive control
        id: leakctl
        continue-on-error: true
        timeout-minutes: 12
        shell: bash
        run: >
          python scripts/spike_q3d_ci.py --frozen --out spike-frozen-leakctl --limit-s 660
          --expect-leak --
          --plan tests/fixtures/plans/bench_small.ogp
          --presets low --shots golden_hour --fps-seconds 0 --size 640x360
          --grass-density 60 --frame-timeout-s 120 --watchdog-s 600
          --soak 100 --soak-leak-mb 25

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-q3d-windows-evidence
          path: |
            spike-unfrozen/
            spike-frozen/
            spike-frozen-warm/
            spike-frozen-leakctl/
            footprint.txt

      # LAST: rewrites src/ and installer/ to master in this working tree (the
      # editable install then resolves to master's code) and builds that.
      - name: Master baseline dist footprint (honest delta)
        if: always()
        timeout-minutes: 12
        shell: bash
        run: |
          git fetch --depth=1 origin master
          # Replace, not overlay: a plain checkout of the paths would leave this
          # branch's extra files (spike_q3d/) in the master tree.
          rm -rf src/open_garden_planner installer
          git checkout FETCH_HEAD -- src installer
          python -m PyInstaller installer/ogp.spec --noconfirm --distpath dist-master --workpath build-master
          python - <<'PY'
          from pathlib import Path
          def mb(root):
              return sum(f.stat().st_size for f in Path(root).rglob("*") if f.is_file()) / 2**20
          branch, master = mb("dist/OpenGardenPlanner"), mb("dist-master/OpenGardenPlanner")
          print(f"master_dist_total_mb={master:.1f}")
          print(f"branch_dist_total_mb={branch:.1f}")
          print(f"delta_mb={branch - master:.1f}")
          new = sorted({p.relative_to("dist/OpenGardenPlanner").as_posix() for p in Path("dist/OpenGardenPlanner").rglob("*") if p.is_file()}
                       - {p.relative_to("dist-master/OpenGardenPlanner").as_posix() for p in Path("dist-master/OpenGardenPlanner").rglob("*") if p.is_file()})
          size = {n: Path("dist/OpenGardenPlanner", n).stat().st_size for n in new}
          print(f"files_only_in_branch={len(new)}")
          for n in sorted(new, key=lambda n: -size[n])[:40]:
              print(f"  {size[n] / 2**20:8.2f} MB  {n}")
          # ADR-047 criterion 9: <= +60 MB net (above that only with owner acceptance)
          if branch - master > 60.0:
              raise SystemExit(f"::error::dist delta {branch - master:.1f} MB > 60 MB (criterion 9)")
          PY

      - name: Verdict
        if: always()
        shell: pwsh
        run: |
          "unfrozen=${{ steps.unfrozen.outcome }} smoke=${{ steps.smoke.outcome }} frozen=${{ steps.frozen.outcome }} warm=${{ steps.warm.outcome }} leakctl=${{ steps.leakctl.outcome }}"
          if ("${{ steps.unfrozen.outcome }}" -ne "success" -or "${{ steps.smoke.outcome }}" -ne "success" -or "${{ steps.frozen.outcome }}" -ne "success" -or "${{ steps.warm.outcome }}" -ne "success" -or "${{ steps.leakctl.outcome }}" -ne "success") { exit 1 }

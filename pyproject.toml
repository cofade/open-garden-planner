[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-garden-planner"
version = "1.31.1"
description = "Open-source garden planning tool with CAD-like precision"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "cofade", email = "cofade@users.noreply.github.com"}
]
keywords = ["garden", "planner", "CAD", "landscape", "design"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Editors",
]
dependencies = [
    # The Qt runtime and its bindings: two exact pins that move TOGETHER. PyQt6's
    # bindings link against the Qt DLLs bundled by PyQt6-Qt6, and the 3D view (Qt
    # Quick 3D, ADR-048) ships inside these two wheels — the bindings in PyQt6, the
    # runtime and its QML modules in PyQt6-Qt6 — so no third wheel has to match.
    # Exact, because an unpinned "PyQt6>=6.6.0" once let a fresh CI resolve float
    # the runtime to another micro than a separately pinned 3D wheel (issue #277,
    # ADR-038; that wheel pair left with Qt 3D in Phase 17 L1.10).
    # tests/unit/test_qt_runtime_pins.py fails CI if the two drift apart, if the
    # lock disagrees, or if Qt Quick 3D is not in what they pin.
    "PyQt6==6.11.0",
    "PyQt6-Qt6==6.11.0",
    "PyQt6-WebEngine>=6.10.0,<6.11",
    "Pillow>=10.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.24",
    "pyclipper>=1.3.0",
    "ezdxf>=0.18",
    # Agent API (US-D1.1): embedded MCP server over streamable-HTTP.
    # Pinned to mcp v1 — v2 renames FastMCP -> MCPServer. uvicorn/starlette/
    # pydantic/anyio/sse-starlette come transitively but are listed where used.
    # Floor is 1.23, the first release whose FastMCP auto-enables transport
    # security for loopback hosts (#396). We now pass TransportSecuritySettings
    # explicitly, but the floor still tracks the SDK behaviour the guard depends
    # on rather than allowing a wheel where the default is off.
    "mcp>=1.23,<2.0",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "pydantic>=2.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.3.0",
    # Parallel suite execution (#509). The measurements, the mode comparison and the
    # marker contract live in `docs/08-crosscutting-concepts/` 8.10.4 and ADR-058.
    "pytest-xdist>=3.8.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "bandit>=1.7.0",
    # Lock-based vulnerability scan (AUD-054). Runs in the Dependencies CI
    # matrix (Linux and Windows); see docs/07-deployment-view §7.4.
    "pip-audit>=2.9.0",
]

[project.scripts]
open-garden-planner = "open_garden_planner.main:main"

[project.gui-scripts]
open-garden-planner-gui = "open_garden_planner.main:main"

[project.urls]
Homepage = "https://github.com/cofade/open-garden-planner"
Repository = "https://github.com/cofade/open-garden-planner"
Issues = "https://github.com/cofade/open-garden-planner/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["open_garden_planner"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG001", "ARG002"]  # pytest fixtures like qtbot are often unused but required

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -n auto --dist worksteal -m 'not perf'"
qt_api = "pyqt6"
markers = [
    "perf: performance benchmarks and NFR budget tests",
    "real_weather_worker: tests exercising the real _WeatherFetchWorker lifecycle",
    "style_gaps_allowed(reason): an integration test that leaves an item's style attributes out of step with its brush and pen on purpose (tests/integration/conftest.py)",
]
# `addopts` carries two #509 decisions, both measured rather than assumed.
#
# `-n auto --dist worksteal` - 4 workers beside ubuntu-latest's 4 vCPUs, 20 on the dev box.
# It splits at test level, so a single slow file never becomes one worker's floor; the mode
# comparison (worksteal vs loadfile vs load) and the reference-tree figures are in
# `docs/08-crosscutting-concepts/` 8.10.4 and ADR-058 rather than repeated here. The cost of
# having it in `addopts` is real:
#   * a SMALL targeted run gets slower, because worker start-up dominates - one 11-test
#     file measured 2.85s serial against 5.48s under `-n auto`. Pass `-n 0` for a single
#     file or a handful of tests.
#   * `-n 0` also works as the escape hatch for anything machine-specific.
#
# The `perf` marker means "wall-clock sensitive", NOT "lives in tests/perf/". That
# distinction is why the flag exists. Three counts orbit it and they are NOT
# interchangeable: 14 tests carry the marker, 12 of them assert a duration, and 7 live
# outside `tests/perf/` - which is why `pytest tests/perf -m perf` runs 7 of the 14 and
# silently passes. Two of the 14 were observed failing intermittently under parallel load:
# the NFR repaint budget and the map-picker close bound. Section 11.4's #354 entry holds
# that performance tests must protect a sustained regression statistically rather than
# assert that one shared runner owns a quiet CPU; running them in their own step is that
# principle applied to scheduling.
#
# CONSEQUENCE, deliberate: `pytest tests/` now DESELECTS the perf tests, so run them
# explicitly with `pytest tests/ -m perf -n 0`:
#   * `tests/`, NOT `tests/perf/`.
#   * `-m perf`, or the `-m 'not perf'` above this line wins and nothing is collected.
#   * `-n 0`, because running the timing tests across workers is precisely what the
#     split exists to prevent.
# CI does this as its own step, so nothing stops being verified. `tests/unit/
# test_perf_marker_guard.py` fails the build if an unmarked wall-clock assertion is
# added, so this list cannot silently go stale.
# Per-test hang guard (pytest-timeout): a stalled full-app test used to freeze the
# whole battery silently (2026-08-17, Package 3a run stalled 18 min in
# test_trellis.py). Generous — the slowest legitimate tests build the full app
# in ~6 s. On Linux/CI the signal method fails just the test; on Windows the
# thread method dumps every thread's stack and aborts the run — both beat a hang.
timeout = 180

[tool.coverage.run]
source = ["src/open_garden_planner"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[dependency-groups]
build = [
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.8",
    "setuptools==84.1.0",
    "wheel==0.48.0",
]

[tool.uv]
required-version = "==0.12.23"

# gitleaks configuration for Open Garden Planner.
#
# WHY THIS FILE EXISTS
# --------------------
# Added after a live Agent API write token was committed to the repo root and
# pushed (PR #369, 2026-09-29). Bandit never saw it — `ci.yml` runs Bandit as
# `-r src/`, and a repo-root file is outside that scope — and Bandit has no
# rule for a credential in a URL query string anyway. So the token had to be
# rotated by hand.
#
# Two things are configured here, and the split matters:
#
#  1. A repo-specific rule for the credential format that actually bit us
#     (bottom of this file). That is the real protection.
#  2. An allowlist for the `generic-api-key` false positives this repo
#     produces. That rule matches on identifier names, and this codebase's
#     vocabulary is saturated with them. Left unallowlisted the gate was red
#     on the very commit that introduced it, with three findings and zero real
#     secrets. A gate that is always red is a gate nobody runs.
#
# SCOPE — read this before widening the allowlist
# -------------------------------------------------
# The allowlist below suppresses EXACTLY ONE rule (`generic-api-key`) on
# EXACTLY FOUR path prefixes. It is not a `paths`-only allowlist and not a
# global one, so:
#
#   * every high-confidence provider rule (GitHub PATs, AWS, Slack, private
#     keys, …) stays active on every path — those are what catch a real
#     credential of a recognised format;
#   * the `ogp-agent-api-token-in-url` rule below is NOT allowlisted anywhere,
#     so the format that actually leaked is still caught on every path,
#     including the ones in this allowlist.
#
# Scoped by RULE + PATH deliberately. An earlier attempt allowlisted by regex
# and matched nothing: gitleaks tests allowlist regexes against the extracted
# SECRET, not the surrounding finding text, and the secret is exactly the part
# that differs run to run. Naming the rule is both narrower and effective.
#
# A regression pin for this file lives in
# `tests/unit/test_gate_commands.py::test_ci_still_scans_for_secrets_across_the_whole_repo`.

title = "Open Garden Planner gitleaks config"

[extend]
# Start from gitleaks' own ruleset, then add the repo-specific rule below.
useDefault = true

# --- Allowlist for the measured generic-api-key false positives --------------
#
# Every finding was produced by a real run against this repo, not guessed:
#
#   src/open_garden_planner/agent_api/domain.py
#     "service, species_key,\n  exclude_antagonists_of=exclude_antagonists_of"
#   tests/integration/test_agent_domain_tools.py
#     "companion_service, species_key,\n  exclude_antagonists_of=..."
#   scripts/fill_translations.py
#     '"Shift+Arrow Keys": "Umschalt+Pfeiltasten"'
#
# The common shape is an identifier ending in `key`/`keys` assigned a value
# within a few characters, which is what generic-api-key's
# `...[\w.-]{0,50}?(key|token|secret|...)...(=|:|\?=)...([\w.=-]{10,150})`
# looks for. `species_key`, `exclude_antagonists_of` and a translation-table
# row all trip it, in every commit, with nothing secret in them.
[[allowlists]]
description = "generic-api-key false positives on identifier names (species_key, translation-table *Keys* rows) — NOT any other rule, NOT any other path"
rules = ["generic-api-key"]
paths = [
  '''^src/''',
  '''^tests/''',
  '''^scripts/''',
  '''^docs/''',
]

# --- The credential format that actually leaked -----------------------------
#
# OGP's Agent API write token is a `secrets.token_urlsafe()` value (43 chars
# of URL-safe base64) passed in the server URL as `?token=...` — the design
# #366 moved to a read-only URL precisely because that URL is a WRITE
# credential when it carries the token. No default gitleaks rule matches a
# token in a URL query parameter, so this one is added explicitly.
#
# The 40-50 char length band is what `token_urlsafe()` produces, and requiring
# the `?token=` assignment keeps a bare 43-char string in a test fixture from
# tripping it. Not allowlisted anywhere above.
[[rules]]
id = "ogp-agent-api-token-in-url"
description = "Open Garden Planner Agent API write token embedded in a URL"
regex = '''(?i)\?token=[A-Za-z0-9_\-]{40,50}'''
keywords = ["token="]
tags = ["secret", "ogp", "agent-api"]
